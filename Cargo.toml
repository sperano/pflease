[package]
name = "pflease"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal viewer for pfSense DHCP leases"
license = "GPL-3.0-or-later"
repository = "https://github.com/sperano/pflease"
readme = "README.md"
keywords = ["pfsense", "dhcp", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
roxmltree = "0.21.2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
unicode-width = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3"
